name: Feature request
description: Something you want Vimma to do that it does not do yet.
labels: [needs-triage, enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search the [open issues](https://github.com/vimma-browser/vimma/issues) and the [roadmap](https://github.com/orgs/vimma-browser/projects/1) first. An open-ended idea or a question fits [Discussions](https://github.com/vimma-browser/vimma/discussions) better.
  - type: textarea
    id: goal
    attributes:
      label: What you want to do
      description: The task, in terms of what you do in the browser, not a particular solution.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What makes it hard or slow today, and how often you run into it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How you would expect it to work
      description: Keys, commands, `config.toml` settings, or what you would see on screen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or how other browsers and extensions do it.
