# Spec m0-pipeline, plan §8 "Unattended runs". Follows anthropics/claude-code-action v1
# (docs/setup.md, examples/claude.yml).
# - `mention`: `@claude` in an issue, issue/PR comment or review answers or acts (interactive mode).
# - `spec`: an issue labelled `spec` gets `claude:go` (a label only the maintainer adds) → Claude
#   implements it on a branch and opens a draft PR labelled `bot` (automation mode).
# Needs the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret and the Claude GitHub app
# (docs/runbook.md). Without a secret every step after the check is skipped and the run is green.
# Scoped token: contents + pull-requests + issues write; no release, signing or other secrets.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]

permissions:
  contents: read

jobs:
  mention:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action != 'labeled' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # the action exchanges an OIDC token for the Claude app token
      actions: read # lets Claude read CI results on PRs
    env:
      HAS_CLAUDE_AUTH: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip without a Claude secret
        if: env.HAS_CLAUDE_AUTH != 'true'
        run: >-
          echo "::notice::claude.yml skipped: add ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN
          (docs/runbook.md)."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 40

  spec:
    if: |
      github.event_name == 'issues' && github.event.action == 'labeled' &&
      github.event.label.name == 'claude:go' &&
      contains(github.event.issue.labels.*.name, 'spec')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      HAS_CLAUDE_AUTH: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip without a Claude secret
        if: env.HAS_CLAUDE_AUTH != 'true'
        run: >-
          echo "::notice::claude.yml skipped: add ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN
          (docs/runbook.md)."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Prepare branch and label
        if: env.HAS_CLAUDE_AUTH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          npm ci
          gh label create bot --color 5319E7 --description "Opened by automation" --force
          git config --global user.name "claude[bot]"
          git config --global user.email "41898282+claude[bot]@users.noreply.github.com"
          git switch -c "claude/spec-$ISSUE-$GITHUB_RUN_ID"

      - uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Implement the spec in issue #${{ github.event.issue.number }} of ${{ github.repository }}
            (read it with `gh issue view ${{ github.event.issue.number }}`). You are on a fresh
            branch from main. Follow CLAUDE.md exactly: read the spec under docs/specs/, write the
            failing tests first, then the code; npm test, npm run typecheck and npm run lint must
            pass. Commit with Conventional Commits whose body is the changelog line, push the
            branch, and open a DRAFT pull request with
            `gh pr create --draft --label bot --base main` that says "Closes #${{ github.event.issue.number }}".
            Never edit .github/workflows, lint config, screenshot baselines or surfer.json pins
            to get green. Never merge. If you cannot finish, comment on the issue with what is left.
          claude_args: >-
            --max-turns 100
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(python3:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr view:*)"
