# Spec m0-pipeline: full Linux x86_64 build, rolling `nightly` release, issue on failure.
# Spec build-supply-chain: it runs on the standard GitHub-hosted runner, never a self-hosted one
# (docs/security.md, B5), from Firefox source that tools/upstream/firefox-source.sh verifies and
# extracts in this job, and restores nothing from the Actions cache (B1, B2). Nothing runs,
# scheduled or manual, until the repository variable NIGHTLY_ENABLED is `true`; a manual run
# (workflow_dispatch) must also start from main. Measured time and disk, and how to switch it
# on: docs/runbook.md, "Full builds".
name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  build:
    # Manual runs only from main: a branch's edited nightly.yml must not get the secret. Manual
    # runs need NIGHTLY_ENABLED too: a run publishes the rolling release, and Firefox source is
    # not yet signature-checked here (spec build-supply-chain, #222 and #224).
    if: >-
      vars.NIGHTLY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    # About 1.5 times the measured job, 124 min (docs/runbook.md, "Full builds"), well under
    # GitHub's 6 hours, so a hung build fails here with its own log and failure handling.
    timeout-minutes: 190
    permissions:
      contents: write # publish the rolling `nightly` release
      issues: write # open an issue when the build fails
    # GH_TOKEN (contents and issues: write) goes only to the two steps that publish or report:
    # npm, Surfer, mach and the mochitests never see it.
    env:
      LOG: ${{ github.workspace }}/nightly.log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # gh gets GH_TOKEN in its own steps; git never pushes

      # No `cache` input: a build restores nothing from the Actions cache (B2).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: npm ci
        run: npm ci --ignore-scripts 2>&1 | tee -a "$LOG"

      # Before the download, so a runner image that shrank fails in seconds, not after an hour of
      # compiling. The build needs about 26 GB, the swap file 16 GB (runbook, "Full builds").
      - name: Disk guard (a full build and its swap file need about 42 GB)
        run: |
          df -h . | tail -1 | tee -a "$LOG"
          free=$(df --output=avail -BG . | tail -1 | tr -dc 0-9)
          if [ "$free" -lt 50 ]; then
            echo "::error::Only ${free} GB free; the build and its swap file need about 42 GB."
            exit 1
          fi

      # The Rust stage of the build peaks at 15.3 GB of the runner's 16 GB of memory plus 10.4 GB
      # of swap; without this file the first measured build was killed after 38 minutes
      # (docs/runbook.md, "Full builds").
      - name: Swap file (16 GB)
        run: |
          sudo fallocate -l 16G /vimma-swapfile
          sudo chmod 600 /vimma-swapfile
          sudo mkswap /vimma-swapfile > /dev/null
          sudo swapon /vimma-swapfile
          free -g

      # Verified against Mozilla's SHA512SUMS and extracted afresh in this job (B1, B2).
      - name: Firefox source (surfer.json), verified and freshly extracted
        run: tools/upstream/firefox-source.sh 2>&1 | tee -a "$LOG"
        shell: bash -o pipefail -e {0}

      # Spec m0-safebrowsing-key. The secret goes to a mode-600 file in RUNNER_TEMP (emptied by
      # the runner per job) through a shell builtin, so our steps never echo it nor put it on a
      # command line (the build itself passes it to the preprocessor; see the spec);
      # configs/common/mozconfig reads VIMMA_SAFEBROWSING_KEYFILE. It stays until every mach call
      # (build, tests, package) is done: mach re-reads the mozconfig, which fails on a missing file.
      - name: Safe Browsing key file
        env:
          SAFEBROWSING_API_KEY: ${{ secrets.SAFEBROWSING_API_KEY }}
        run: |
          if [ -z "$SAFEBROWSING_API_KEY" ]; then
            echo "::error::secret SAFEBROWSING_API_KEY is not set; a nightly must have the key"
            exit 1
          fi
          keyfile="$RUNNER_TEMP/vimma-safebrowsing.key"
          (umask 077 && printf '%s' "$SAFEBROWSING_API_KEY" > "$keyfile")
          echo "VIMMA_SAFEBROWSING_KEYFILE=$keyfile" >> "$GITHUB_ENV"

      - name: Import patches and our sources
        run: |
          set -o pipefail
          npm run import 2>&1 | tee -a "$LOG"

      # `surfer import` needed engine/'s empty repository; mach must not see it: its taskgraph
      # hashes the files a repository tracks to find Mozilla's toolchains for --enable-bootstrap,
      # and finds none in an empty one. Without .git, engine/ is a source tarball to mach.
      - name: Build
        run: |
          set -o pipefail
          rm -rf engine/.git
          npx --no -- surfer build 2>&1 | tee -a "$LOG"

      - name: Smoke check
        run: |
          set -o pipefail
          version=$(engine/obj-x86_64-pc-linux-gnu/dist/bin/vimma --version 2>&1 | tee -a "$LOG")
          # "Vimma <vimma> · Firefox <firefox>" from surfer.json (spec firefox-versions).
          expected=$(node tools/release/version-line.mjs)
          # A nightly that lost the Vimma brand (e.g. built `unofficial`) must not be published.
          [ "$version" = "$expected" ] || { echo "::error::--version is '$version', want '$expected'"; exit 1; }
          # appinfo.version is the Firefox version (spec m0-app-version); --version shows Vimma's.
          appver=$(sed -n 's/^Version=//p' engine/obj-x86_64-pc-linux-gnu/dist/bin/application.ini)
          firefox=$(node -p 'require("./surfer.json").version.version')
          [ "$appver" = "$firefox" ] || { echo "::error::app version is '$appver', want '$firefox'"; exit 1; }

      - name: Mochitests on the full build
        # PRs run them on an artifact build (e2e.yml, ADR-010), which skips what only a full
        # build has (skip-if = ["artifact"], e.g. browser_vimma_crash_reporter.js).
        env:
          VIMMA_EXPECT_SAFEBROWSING_KEY: "1" # browser_vimma_safebrowsing.js fails without it
        run: |
          set -o pipefail
          npm run mochitest -- tests/browser/ 2>&1 | tee -a "$LOG"

      - name: Package
        # `./mach package`, not `surfer package`: Surfer's then reads locales/supported-languages,
        # which this repo does not have, and builds a MAR for an updater we compile out
        # (spec m6-packaging, Findings). Release packages: release.yml.
        run: |
          set -o pipefail
          rm -rf dist && mkdir dist
          rm -f engine/obj-x86_64-pc-linux-gnu/dist/vimma-*.tar.xz
          (cd engine && ./mach package) 2>&1 | tee -a "$LOG"
          cp engine/obj-x86_64-pc-linux-gnu/dist/vimma-*.en-US.linux-x86_64.tar.xz dist/
          ls -l dist

      - name: Delete the Safe Browsing key file
        if: always()
        run: rm -f "$RUNNER_TEMP/vimma-safebrowsing.key"

      - name: Publish rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* --prerelease --target "$SHA" --title "Vimma nightly" \
            --notes "Rolling nightly build of ${SHA}, $(date -u +%Y-%m-%d). Not signed (M6)."

      # Masking doesn't cover artifacts or issue bodies, which go public with the repo: scrub the
      # key from the log before either sees it.
      - name: Redact the Safe Browsing key from the log
        if: always()
        env:
          SB_KEY: ${{ secrets.SAFEBROWSING_API_KEY }}
        run: |
          if [ -n "${SB_KEY:-}" ] && [ -f "$LOG" ]; then
            sed -i "s|${SB_KEY}|[redacted]|g" "$LOG"
          fi

      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-log
          path: nightly.log
          retention-days: 14

      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create nightly-failure --color B60205 \
            --description "nightly.yml failed" --force
          {
            echo "Nightly build failed: ${RUN_URL} (full log in the run's \`nightly-log\` artifact)."
            echo
            echo "Last 150 log lines:"
            echo
            echo '```text'
            # The log is already redacted (step above); also drop lines naming the key define.
            tail -n 150 "$LOG" 2>/dev/null \
              | grep -v -i 'safebrowsing_api_key\|safebrowsing-api-key' || echo "(no log)"
            echo '```'
          } > issue.md
          open=$(gh issue list --label nightly-failure --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file issue.md
          else
            gh issue create --title "Nightly build failed $(date -u +%Y-%m-%d)" \
              --label nightly-failure --body-file issue.md
          fi
