# Spec m0-build-strategy, ADR-010: the mochitest browser-chrome suite on an artifact build, on a
# GitHub-hosted runner. The engine is the Firefox release source tarball with our patches and
# front end; the compiled binaries are Mozilla's own build of that exact release (the revision
# in engine/sourcestamp.txt), downloaded from Taskcluster by `mach build`. No self-hosted runner,
# no secrets: safe for pull requests from forks once the repo is public (read-only token).
# The socket-driven e2e and screenshot diffs (plan §4) join this job when they exist.
name: e2e

on:
  pull_request:
    # ready_for_review: PRs opened with GITHUB_TOKEN (claude.yml, upstream.yml) do not trigger
    # workflows; marking them ready (or a manual run) starts this as the owner.
    types: [opened, synchronize, reopened, ready_for_review]
    # Only what can change the browser or the test run: Actions minutes are limited while the
    # repo is private (docs/runbook.md, "Actions minutes budget").
    paths:
      - "src/**"
      - "tests/browser/**"
      - "packages/vimma-core/**"
      - "configs/**"
      - "surfer.json"
      - "package.json"
      - "package-lock.json"
      - "tools/artifact-build/**"
      - "tools/mochitest.mjs"
      - "tools/sync-core.mjs"
      - "tools/version-files/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mochitest:
    name: mochitest (artifact build)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      # Disk guards. Measured (PR #8): ~13 GB free before the download; the tarball (0.8 GB) and
      # tree (4.7 GB) leave ~8.3 GB once the tarball is deleted; build and tests then use 1.2 GB,
      # ending at 7.1 GB. Each guard asks for the step's use plus ~2 GB of margin.
      - name: Disk guard (download and unpack need ~6 GB)
        run: |
          df -h . | tail -1
          free=$(df --output=avail -BG . | tail -1 | tr -dc 0-9)
          if [ "$free" -lt 8 ]; then
            echo "::error::Only ${free} GB free; the Firefox source needs ~6 GB (ADR-010). Free space first, e.g. rm -rf /usr/local/lib/android (~9 GB)."
            exit 1
          fi

      - name: Firefox source tarball (surfer.json), unpacked without history
        env:
          CI_SKIP_INIT: "1" # Surfer's own switch: skips `git init` + commit of 4.7 GB
        run: |
          npx surfer download
          # An empty repo, so `git apply` in `surfer import` resolves paths inside engine/
          # rather than against this checkout.
          git init -q engine
          # The runner has ~7.5 GB free once unpacked; the 0.8 GB tarball is not needed again.
          rm -f .surfer/engine/firefox-*.source.tar.xz
          df -h . | tail -1

      - name: Import our patches and sources
        run: npm run import

      - name: Disk guard (artifact build and tests need ~1.2 GB)
        run: |
          free=$(df --output=avail -BG . | tail -1 | tr -dc 0-9)
          if [ "$free" -lt 3 ]; then
            echo "::error::Only ${free} GB free; the artifact build and tests need ~1.2 GB (ADR-010). Free space first, e.g. rm -rf /usr/local/lib/android (~9 GB)."
            exit 1
          fi

      - name: Artifact build (tools/artifact-build)
        run: node tools/artifact-build/artifact-build.mjs

      - name: Mochitests (npm run mochitest -- --artifact tests/browser/)
        run: |
          npm run mochitest -- --artifact tests/browser/
          df -h . | tail -1
          du -sh engine engine/obj-artifact ~/.mozbuild 2>/dev/null || true
