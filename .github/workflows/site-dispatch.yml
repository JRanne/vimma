# Spec site-keys-mirror. When the default bindings change on main, tell JRanne/vimma-site, whose
# own workflow fetches docs/bindings.json at this commit and opens a pull request with it.
# Needs the secret SITE_DISPATCH_TOKEN: a fine-grained token for JRanne/vimma-site only, with
# "Contents: read and write" (what the repository_dispatch endpoint requires). Without it the job
# logs a notice and succeeds, so main stays green until the secret is set.
# No checkout and no third-party action: one API call with the runner's gh.
name: Site dispatch

on:
  push:
    branches: [main]
    paths: [docs/bindings.json]
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: tell vimma.dev the bindings changed
    if: github.repository == 'JRanne/vimma'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: repository_dispatch to JRanne/vimma-site
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set; vimma.dev was not told about $SHA"
            exit 0
          fi
          gh api --method POST repos/JRanne/vimma-site/dispatches \
            -f event_type=vimma-bindings -f "client_payload[sha]=$SHA"
          echo "dispatched vimma-bindings for $SHA"
