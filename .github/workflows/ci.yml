# Spec m0-pipeline. One job on purpose: Actions minutes on the free private plan are billed per
# job, rounded up to the minute.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: PRs opened with GITHUB_TOKEN (claude.yml, upstream.yml) do not trigger
    # workflows; marking them ready (or a manual run below) starts CI as the owner.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: lint, typecheck, test, commitlint, licences
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commitlint reads the whole PR range

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Lint (eslint + prettier)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest with coverage gate (vitest.config.mjs)
        run: npm run coverage

      # Plan §5 performance gate (issue #17): fails on a case over 50 µs, or the suite more than
      # 10 % slower (one case 25 %) than the baseline recorded for this runner's CPU model. A step,
      # not a job (~30 s; no extra per-job minute). Why it does not flake: docs/runbook.md,
      # "Bench baseline".
      - name: Key-to-action bench against the baseline
        run: npm run bench -- --check

      - name: Python tests (tools/upstream)
        run: npm run test:py

      - name: Licences of package-lock.json
        run: npm run license-check

      - name: MPL headers in src/
        run: npx surfer license-check

      - name: commitlint (PR range)
        if: github.event_name == 'pull_request'
        env:
          FROM: ${{ github.event.pull_request.base.sha }}
          TO: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$FROM" --to "$TO" --verbose

      - name: commitlint (manual run, branch vs main)
        if: github.event_name == 'workflow_dispatch'
        run: npx commitlint --from origin/main --to HEAD --verbose

      - name: commitlint (pushed range)
        if: github.event_name == 'push'
        env:
          FROM: ${{ github.event.before }}
          TO: ${{ github.sha }}
        run: |
          if [ "$FROM" = "0000000000000000000000000000000000000000" ]; then
            npx commitlint --last --verbose
          else
            npx commitlint --from "$FROM" --to "$TO" --verbose
          fi
