# vimma-ctl: client for Vimma's control socket (ADR-007, ADR-011,
# docs/specs/m0-control-protocol-and-vimma-ctl.md). A standalone crate, not a root workspace:
# it is the only Rust in the repo, and keeping Cargo.toml out of the root leaves Surfer's tree
# and `engine/` (Firefox's own Cargo workspace) undisturbed.
[package]
name = "vimma-ctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
description = "Command-line client for the Vimma browser's control socket"
repository = "https://github.com/JRanne/vimma"
publish = false

# No dependencies on purpose (ADR-011): std only, so the binary and its licence check stay trivial.
[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
strip = true
lto = true
