# vimma default configuration.
# Generated from packages/vimma-core/src/defaults.mjs by `npm run gen-docs`; do not edit.
# Copy any line into ~/.config/vimma/config.toml to change it.
schema = 2

[keys]
prefix = "ctrl+b"
show_keybinds = ["prefix+?"]
new_tab = ["prefix+c"]
next_tab = ["prefix+n"]
previous_tab = ["prefix+p"]
select_tab_1 = ["prefix+1"]
select_tab_2 = ["prefix+2"]
select_tab_3 = ["prefix+3"]
select_tab_4 = ["prefix+4"]
select_tab_5 = ["prefix+5"]
select_tab_6 = ["prefix+6"]
select_tab_7 = ["prefix+7"]
select_tab_8 = ["prefix+8"]
select_tab_9 = ["prefix+9"]
rename_tab = ["prefix+shift+t"]
close_tab = ["prefix+shift+x"]
split_vertical = ["prefix+v"]
split_horizontal = ["prefix+minus"]
focus_pane_left = ["prefix+h"]
focus_pane_down = ["prefix+j"]
focus_pane_up = ["prefix+k"]
focus_pane_right = ["prefix+l"]
swap_pane_left = ["prefix+shift+h"]
swap_pane_down = ["prefix+shift+j"]
swap_pane_up = ["prefix+shift+k"]
swap_pane_right = ["prefix+shift+l"]
zoom = ["prefix+z"]
close_pane = ["prefix+x"]
resize_mode = ["prefix+r"]
next_workspace = ["prefix+)"]
previous_workspace = ["prefix+("]
workspace_picker = ["prefix+w"]
new_workspace = ["prefix+shift+n"]
rename_workspace = ["prefix+shift+w"]
close_workspace = ["prefix+shift+d"]
goto_picker = ["prefix+g"]
toggle_sidebar = ["prefix+b"]
toggle_bookmarks = ["prefix+shift+b"]
add_bookmark = ["prefix+a"]
copy_mode = ["prefix+["]

[modal]
leader = " "
timeout_ms = 800
# Hint labels are made of these characters, the first ones most often.
hint_chars = "asdfghjkl"

[modal.normal]
"j" = "scroll.down"
"k" = "scroll.up"
"h" = "scroll.left"
"l" = "scroll.right"
"d" = "scroll.half_down"
"u" = "scroll.half_up"
"<C-d>" = "scroll.half_down"
"<C-u>" = "scroll.half_up"
"<C-e>" = "scroll.down"
"<C-y>" = "scroll.up"
"gg" = "scroll.top"
"G" = "scroll.bottom"
"H" = "history.back"
"L" = "history.forward"
"<C-o>" = "history.back"
"<C-i>" = "history.forward"
"r" = "page.reload"
"f" = "hint.follow"
"F" = "hint.follow_new_tab"
"/" = "find.forward"
"?" = "find.backward"
"n" = "find.next"
"N" = "find.previous"
"i" = "mode.insert"
"I" = "urlbar.focus"
"v" = "mode.visual"
":" = "command.open"
"t" = "tab.new"
"x" = "tab.close"
"gt" = "tab.next"
"gT" = "tab.previous"
"b" = "goto.picker"
"yy" = "page.yank_url"
"p" = "page.open_clipboard"
"P" = "page.open_clipboard_new_tab"
"gi" = "page.focus_input"
"gu" = "page.url_up"
"gU" = "page.url_root"
"gf" = "page.view_source"
"<C-w>h" = "pane.focus_left"
"<C-w>j" = "pane.focus_down"
"<C-w>k" = "pane.focus_up"
"<C-w>l" = "pane.focus_right"
"<C-w>H" = "pane.swap_left"
"<C-w>J" = "pane.swap_down"
"<C-w>K" = "pane.swap_up"
"<C-w>L" = "pane.swap_right"
"<C-w>o" = "pane.zoom"
"<C-w><" = "pane.resize_narrower"
"<C-w>>" = "pane.resize_wider"
"<C-w>+" = "pane.resize_taller"
"<C-w>-" = "pane.resize_shorter"

[modal.insert]
"<Esc>" = "mode.normal"

[modal.visual]
"0" = "caret.line_start"
"<Esc>" = "mode.normal"
"h" = "caret.left"
"j" = "caret.down"
"k" = "caret.up"
"l" = "caret.right"
"w" = "caret.word_forward"
"b" = "caret.word_backward"
"$" = "caret.line_end"
"gg" = "caret.top"
"G" = "caret.bottom"
"e" = "caret.word_end"
"ge" = "caret.word_end_backward"
"W" = "caret.bigword_forward"
"B" = "caret.bigword_backward"
"E" = "caret.bigword_end"
"^" = "caret.first_nonblank"
"{" = "caret.paragraph_backward"
"}" = "caret.paragraph_forward"
"f" = "caret.find_forward"
"F" = "caret.find_backward"
"t" = "caret.till_forward"
"T" = "caret.till_backward"
";" = "caret.find_repeat"
"," = "caret.find_repeat_reverse"
"v" = "selection.toggle"
"V" = "selection.line"
"o" = "selection.swap"
"iw" = "selection.inner_word"
"aw" = "selection.a_word"
"y" = "selection.yank"
"Y" = "selection.yank_lines"
"I" = "urlbar.focus"

[modal.command]
"<Esc>" = "command.cancel"

[modal.hint]
"<Esc>" = "hint.cancel"

[modal.help]
"<Esc>" = "help.close"
"/" = "help.filter"
"q" = "help.close"

[modal.panel]
"1" = "panel_select_1"
"2" = "panel_select_2"
"3" = "panel_select_3"
"4" = "panel_select_4"
"5" = "panel_select_5"
"6" = "panel_select_6"
"7" = "panel_select_7"
"8" = "panel_select_8"
"9" = "panel_select_9"
"j" = "panel.down"
"k" = "panel.up"
"<CR>" = "panel.open"
"<Esc>" = "panel.close"
"I" = "urlbar.focus"
"h" = "bookmarks.collapse"
"l" = "bookmarks.expand"
"t" = "bookmarks.open_tab"
"s" = "bookmarks.open_vsplit"
"S" = "bookmarks.open_hsplit"
"a" = "bookmarks.add"
"A" = "bookmarks.add_folder"
"r" = "bookmarks.rename"
"m" = "bookmarks.move"
"d" = "bookmarks.delete"
"y" = "bookmarks.yank"
"/" = "bookmarks.filter"

[modal.resize]
"h" = "pane.resize_narrower"
"l" = "pane.resize_wider"
"j" = "pane.resize_taller"
"k" = "pane.resize_shorter"
"<Left>" = "pane.resize_narrower"
"<Right>" = "pane.resize_wider"
"<Down>" = "pane.resize_taller"
"<Up>" = "pane.resize_shorter"
"<lt>" = "pane.resize_narrower"
">" = "pane.resize_wider"
"+" = "pane.resize_taller"
"-" = "pane.resize_shorter"
"<Esc>" = "pane.resize_exit"
"<CR>" = "pane.resize_exit"
"q" = "pane.resize_exit"

[unbind]
normal = []

# Order here is the order ctrl+b ) goes in; each workspace is a Firefox container. None by default.
# Left-out keys: color = "gray", icon = "circle", autofill = true.
[workspaces]
# work = { color = "blue", icon = "briefcase", home = "https://intranet.example" }

# "omarchy" follows the current Omarchy theme (Tokyo Night without one); "file" is Tokyo Night.
[theme]
source = "omarchy"
font = "monospace"

# Overrides on top of the palette, with the keys of Omarchy's colors.toml.
[theme.colors]
# accent = "#7aa2f7"

# The most panes (live pages) one workspace shows at once, 1 to 16.
[panes]
max = 4

# Per-site insert mode: auto (detect text fields), never (keys stay vimma's), always.
# A host also covers its subdomains. None by default.
# [sites."docs.google.com"]
# insert = "always"

# Which workspace a link opens in: by domain (and its subdomains), url prefix, or the app
# that opened it (vimma-open). The first matching rule wins. None by default.
# [[routes]]
# domain = "github.com"
# workspace = "work"
