   - string, so the same file serves the same-origin and the cross-origin frame. -->

  <head>
    <meta charset="utf-8" />
    <title>vimma find frame</title>
  </head>
  <body>
    <p id="text"></p>
    <script>
      document.getElementById("text").textContent = `framed ${location.search.slice(1)}`;
    </script>
  </body>
</html>
