<!-- Fixture for browser_vimma_insert_focus.js: a login form that focuses its user name on load
   - and moves to the password on Enter, as many sign-in pages do. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>vimma autofocus</title>
  </head>
  <body>
    <form id="login">
      <input id="user" autocomplete="off" autofocus />
      <input id="pass" type="password" autocomplete="off" />
      <button id="submit" type="button">Sign in</button>
    </form>
    <script>
      document.getElementById("user").addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        e.preventDefault();
        document.getElementById("pass").focus();
      });
    </script>
  </body>
</html>
